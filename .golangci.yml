# golangci-lint configuration for KI - Dragon Ball CLI

run:
  # Timeout for analysis, e.g. 30s, 5m.
  timeout: 5m

  # Exit code when at least one issue was found.
  issues-exit-code: 1

  # Include test files.
  tests: true

  # Modules download mode.
  modules-download-mode: readonly

# Output configuration options
output:
  # Format: colored-line-number|line-number|json|tab|checkstyle|code-climate
  formats:
    - format: colored-line-number

  # Print lines of code with issue.
  print-issued-lines: true

  # Print linter name in the end of issue text.
  print-linter-name: true

  # Make issues output unique by line.
  uniq-by-line: true

# All available settings of specific linters
linters-settings:
  errcheck:
    # Report about not checking of errors in type assertions: `a := b.(MyStruct)`.
    check-type-assertions: true

    # Report about assignment of errors to blank identifier: `num, _ := strconv.Atoi(numStr)`.
    check-blank: false

  govet:
    # Enable all analyzers.
    enable-all: true

    # Disable analyzers by name.
    disable:
      - fieldalignment # Too strict for readability

  gofmt:
    # Simplify code: gofmt with `-s` option.
    simplify: true

  goimports:
    # Put imports beginning with prefix after 3rd-party packages.
    local-prefixes: github.com/bilalbaraz/ki

  golint:
    # Minimal confidence for issues, default is 0.8.
    min-confidence: 0.8

  gocyclo:
    # Minimal code complexity to report.
    min-complexity: 15

  dupl:
    # Tokens count to trigger issue.
    threshold: 100

  goconst:
    # Minimal length of string constant.
    min-len: 3

    # Minimum occurrences of constant string count to trigger issue.
    min-occurrences: 3

  misspell:
    # Correct spellings using locale preferences for US or UK.
    locale: US

  lll:
    # Max line length, lines longer will be reported.
    line-length: 120

    # Tab width in spaces.
    tab-width: 4

  unused:
    # Treat code as a program (not a library).
    check-exported: false

  unparam:
    # Inspect exported functions.
    check-exported: false

  nakedret:
    # Make an issue if func has more lines of code than this setting, and it has naked returns.
    max-func-lines: 30

  prealloc:
    # Report preallocation suggestions only on simple loops that have no returns/breaks/continues/gotos in them.
    simple: true
    range-loops: true
    for-loops: false

  gocritic:
    # Enable multiple checks by tags.
    enabled-tags:
      - diagnostic
      - style
      - performance

    disabled-checks:
      - commentedOutCode
      - whyNoLint

linters:
  # Disable all linters.
  disable-all: true

  # Enable specific linters.
  enable:
    - errcheck      # Checks for unchecked errors
    - gosimple      # Simplify code
    - govet         # Reports suspicious constructs
    - ineffassign   # Detects ineffectual assignments
    - staticcheck   # Go static analysis
    - unused        # Checks for unused constants, variables, functions and types
    - typecheck     # Type-checks Go code
    - gofmt         # Checks whether code was gofmt-ed
    - goimports     # Checks import statements are formatted
    - misspell      # Finds commonly misspelled English words
    - goconst       # Finds repeated strings that could be constants
    - gocyclo       # Computes cyclomatic complexity
    - gosec         # Inspects source code for security problems
    - dupl          # Code clone detection
    - revive        # Fast, configurable, extensible, flexible, and beautiful linter for Go
    - stylecheck    # Stylecheck is a replacement for golint
    - unconvert     # Remove unnecessary type conversions
    - unparam       # Reports unused function parameters
    - nakedret      # Finds naked returns in functions
    - prealloc      # Finds slice declarations that could potentially be pre-allocated
    - exportloopref # Checks for pointers to enclosing loop variables
    - gocritic      # Provides many diagnostics

issues:
  # List of regexps of issue texts to exclude.
  exclude:
    # Exclude some linters from running on tests files.
    - path: _test\.go
      linters:
        - gocyclo
        - errcheck
        - dupl
        - gosec

  # Excluding configuration per-path, per-linter, per-text and per-source
  exclude-rules:
    # Exclude known linters from partially hard-vendored code.
    - path: internal/tui/
      linters:
        - gocritic
      text: "unnecessaryDefer"

    # Exclude shadow checking on the variable named err
    - linters:
        - govet
      text: 'shadow: declaration of "err"'

    # Exclude lll issues for long lines with go:generate
    - linters:
        - lll
      source: "^//go:generate "

  # Independently of option `exclude` we use default exclude patterns.
  exclude-use-default: false

  # Maximum issues count per one linter.
  max-issues-per-linter: 0

  # Maximum count of issues with the same text.
  max-same-issues: 0

  # Show only new issues.
  new: false

severity:
  # Default value is empty string.
  default-severity: error

  # The default value is false.
  case-sensitive: false
